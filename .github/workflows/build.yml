name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to attach the APK to a release on tags
    steps:
      - uses: actions/checkout@v4

      # Android Gradle Plugin 4.2.2 (needed for minSdk 7) runs on JDK 11 and Gradle 6.9.x.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # No gradle-wrapper.jar is checked in, so install Gradle directly.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.9.4'

      - name: Install Android SDK pieces
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;30.0.3"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlipLauncher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
