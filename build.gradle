buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // 4.2.x is the last Android Gradle Plugin line that comfortably builds minSdk 7.
        classpath 'com.android.tools.build:gradle:4.2.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
